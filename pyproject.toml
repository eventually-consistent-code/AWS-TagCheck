[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-tag-manager"
version = "0.1.0"
description = "Compare AWS EC2 instance tags against a canonical Environment/Product list, merge a desired-tags CSV into a gold list, and publish reports to S3"
readme = "README.txt"
requires-python = ">=3.10"
authors = [
  { name = "John Reed" },
  { name = "Nick Bitzer" },
]
dependencies = [
  "boto3>=1.34",
  "azure-identity>=1.16",
  "azure-mgmt-resourcegraph>=8.0",
  "google-cloud-asset>=3.24",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "apscheduler>=3.10",
  "authlib>=1.3",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pylint>=3.0",
  "pycodestyle>=2.11",
]

[project.scripts]
aws-tag-manager = "aws_tag_manager:main"

[tool.setuptools]
packages = ["tagmanager"]
py-modules = ["aws_tag_manager", "aws"]

[tool.pytest.ini_options]
testpaths = ["tests"]
