services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tagmanager
      POSTGRES_PASSWORD: tagmanager
      POSTGRES_DB: tagmanager
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      TAGMANAGER_DB_URL: postgresql+psycopg://tagmanager:tagmanager@db/tagmanager
    depends_on: [db]
